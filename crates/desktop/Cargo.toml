[package]
name = "kcastle-desktop"
description = "Native GPUI desktop interface for kcastle-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
fuzzing = []

[[bin]]
name = "kcastle-desktop"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
im.workspace = true
kcastle-agent.workspace = true
markdown.workspace = true
ratex-layout.workspace = true
ratex-parser.workspace = true
ratex-svg.workspace = true
ratex-types.workspace = true
roxmltree = "=0.21.1"
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }
tree-sitter-haskell.workspace = true
tree-sitter.workspace = true
unicode-linebreak.workspace = true
velopack.workspace = true
wry = { package = "lb-wry", version = "=0.53.3", default-features = false, features = ["os-webview", "x11", "drag-drop"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
gdkx11 = "=0.18.2"
webkit2gtk = "=2.0.1"
cairo-rs = { version = "=0.18.5", features = ["png"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSEvent", "NSCursor", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow", "NSAccessibilityProtocols", "NSImage", "NSImageRep", "NSBitmapImageRep"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSGeometry", "NSNotification", "NSObject", "NSOperation", "NSString", "NSData", "NSDictionary", "NSError", "NSValue", "block2"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
objc2-quartz-core = { version = "=0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
raw-window-handle = "=0.6.2"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
proptest.workspace = true
