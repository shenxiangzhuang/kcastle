[project]
name = "kcastle"
version = "0.1.0a3"
description = "Textual interface for kcastle-agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kcastle-agent==0.1.0a3",
    "textual==8.2.8",
]

[project.scripts]
kcastle = "ktui.cli:main"
k = "ktui.cli:main"

[build-system]
requires = ["uv_build==0.12.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ktui"
