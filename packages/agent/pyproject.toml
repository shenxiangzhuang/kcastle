[project]
name = "kcastle-agent"
version = "0.1.0a4"
description = "A minimal OpenAI Responses agent harness"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==2.53.0",
    "pydantic==2.13.4",
]

[build-system]
requires = ["uv_build==0.12.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "kagent"
