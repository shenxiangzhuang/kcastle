[workspace]
members = ["crates/agent", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.19"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/shenxiangzhuang/kcastle"

[workspace.dependencies]
async-openai = { version = "=0.41.3", default-features = false, features = ["responses", "rustls"] }
futures-util = "=0.3.34"
im = "=15.1.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "da4f93696dc2b2b4d91bcc42412b9053a3d24de8" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "da4f93696dc2b2b4d91bcc42412b9053a3d24de8" }
markdown = "=1.0.0"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
libc = "=0.2.189"
proptest = "=1.11.0"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tokio-util = "=0.7.19"
unicode-linebreak = "=0.1.5"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros"] }
velopack = "=1.2.110-ge826545"

kcastle-agent = { path = "crates/agent", version = "=0.2.0-alpha.19" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"
