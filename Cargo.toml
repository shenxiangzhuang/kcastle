[workspace]
members = ["crates/agent", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.2"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/shenxiangzhuang/kcastle"

[workspace.dependencies]
async-openai = { version = "=0.41.3", default-features = false, features = ["responses", "rustls"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.34"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
ratatui-core = { version = "=0.1.2", features = ["scrolling-regions"] }
ratatui-crossterm = { version = "=0.1.2", features = ["scrolling-regions"] }
ratatui-textarea = { version = "=0.9.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tokio-util = "=0.7.19"
markdown-stream = { package = "codewandler-markdown-stream", version = "=0.2.1" }
markdown-ratatui = { package = "codewandler-markdown-ratatui", version = "=0.2.1" }
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros"] }

kcastle-agent = { path = "crates/agent", version = "=0.2.0-alpha.2" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
