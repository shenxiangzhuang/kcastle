[workspace]
members = ["crates/agent", "crates/desktop", "crates/tui"]
resolver = "3"

[workspace.package]
version = "0.2.0-alpha.9"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/shenxiangzhuang/kcastle"

[workspace.dependencies]
async-openai = { version = "=0.41.3", default-features = false, features = ["responses", "rustls"] }
crossterm = { version = "=0.29.0", features = ["event-stream"] }
futures-util = "=0.3.34"
fs2 = "=0.4.3"
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
markdown = "=1.0.0"
ratex-layout = "=0.1.14"
ratex-parser = "=0.1.14"
ratex-svg = { version = "=0.1.14", features = ["embed-fonts"] }
ratex-types = "=0.1.14"
libc = "=0.2.189"
proptest = "=1.11.0"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm", "layout-cache", "unstable-rendered-line-info"] }
ratatui-core = { version = "=0.1.2", features = ["scrolling-regions"] }
ratatui-crossterm = { version = "=0.1.2", features = ["scrolling-regions"] }
ratatui-textarea = { version = "=0.9.2", default-features = false, features = ["crossterm"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
tokio = "=1.53.1"
tokio-util = "=0.7.19"
unicode-linebreak = "=0.1.5"
uuid = { version = "=1.24.0", features = ["serde", "v4"] }
markdown-stream = { package = "codewandler-markdown-stream", version = "=0.2.1" }
markdown-ratatui = { package = "codewandler-markdown-ratatui", version = "=0.2.1" }
time = { version = "=0.3.55", features = ["formatting", "local-offset", "macros"] }
velopack = "=1.2.110-ge826545"

kcastle-agent = { path = "crates/agent", version = "=0.2.0-alpha.9" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
