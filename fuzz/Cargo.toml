[package]
name = "kcastle-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[features]
default = ["fuzzing"]
fuzzing = []

[dependencies]
kcastle-agent = { path = "../crates/agent" }
libfuzzer-sys = "0.4"
markdown = "=1.0.0"
serde_json = "=1.0.151"

[[bin]]
name = "streaming_markdown"
path = "fuzz_targets/streaming_markdown.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "session_events"
path = "fuzz_targets/session_events.rs"
test = false
doc = false
bench = false
