[project]
name = "k"
version = "0.1.0a0"
description = "A minimal agent harness and Textual interface"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["kcastle"]

[dependency-groups]
dev = [
    "prek>=0.4.11",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0",
    "ty>=0.0.65",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kcastle-agent = { workspace = true }
kcastle = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.pytest.ini_options]
testpaths = ["packages"]
asyncio_mode = "auto"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = [
    "packages/agent/src",
    "packages/agent/tests",
    "packages/tui/src",
    "packages/tui/tests",
]
