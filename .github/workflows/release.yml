name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kcastle") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Publish kcastle-agent
        run: cargo publish --locked -p kcastle-agent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for registry propagation
        run: |
          version=${GITHUB_REF_NAME#v}
          for attempt in {1..12}; do
            cargo info "kcastle-agent@${version}" && exit 0
            sleep 10
          done
          exit 1
      - name: Publish kcastle
        run: cargo publish --locked -p kcastle
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  desktop-apps:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            asset: kcastle-desktop-linux-amd64.deb
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            targets: aarch64-unknown-linux-gnu
            asset: kcastle-desktop-linux-arm64.deb
          - os: macos-14
            target: universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            asset: kcastle-desktop-macos-universal.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            asset: kcastle-desktop-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Build Linux or Windows desktop app
        if: runner.os != 'macOS'
        run: cargo build --release --locked -p kcastle-desktop --target ${{ matrix.target }}
      - name: Build universal macOS desktop app
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked -p kcastle-desktop --target aarch64-apple-darwin
          cargo build --release --locked -p kcastle-desktop --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/kcastle-desktop \
            target/x86_64-apple-darwin/release/kcastle-desktop \
            -output target/universal-apple-darwin/release/kcastle-desktop
      - name: Package Linux desktop app
        if: runner.os == 'Linux'
        run: scripts/package-deb target/${{ matrix.target }}/release/kcastle-desktop ${{ matrix.asset }}
      - name: Package macOS desktop app
        if: runner.os == 'macOS'
        run: |
          scripts/package-macos-app target/${{ matrix.target }}/release/kcastle-desktop
          staging=$(mktemp -d)
          trap 'rm -rf "$staging"' EXIT
          ditto target/kcastle.app "$staging/kcastle.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname kcastle -srcfolder "$staging" -ov -format UDZO ${{ matrix.asset }}
      - name: Package Windows desktop app
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/${{ matrix.target }}/release/kcastle-desktop.exe ${{ matrix.asset }}
      - name: Upload desktop app
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" ${{ matrix.asset }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
