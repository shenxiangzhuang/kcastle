name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up environment
        uses: ./.github/actions/setup-python-env

      - name: Build kcastle-agent
        run: uv build --package kcastle-agent --no-sources --out-dir dist/kcastle-agent

      - name: Build kcastle
        run: uv build --package kcastle --no-sources --out-dir dist/kcastle

      - name: Upload kcastle-agent artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-kcastle-agent
          path: dist/kcastle-agent/

      - name: Upload kcastle artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-kcastle
          path: dist/kcastle/

  publish-kcastle-agent:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-kcastle-agent
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*

  publish-kcastle:
    runs-on: ubuntu-latest
    needs: publish-kcastle-agent
    permissions:
      id-token: write
    environment: pypi
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist-kcastle
          path: dist/

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always dist/*
