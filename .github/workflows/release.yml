name: Release

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify release tag
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "kcastle") | .version')
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Publish kcastle-agent
        run: cargo publish --locked -p kcastle-agent
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for registry propagation
        run: |
          version=${GITHUB_REF_NAME#v}
          for attempt in {1..12}; do
            cargo info "kcastle-agent@${version}" && exit 0
            sleep 10
          done
          exit 1
      - name: Publish kcastle
        run: cargo publish --locked -p kcastle
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p kcastle --target ${{ matrix.target }}
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        run: tar -C target/${{ matrix.target }}/release -czf kcastle-${{ matrix.target }}.tar.gz kcastle
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive target/${{ matrix.target }}/release/kcastle.exe kcastle-${{ matrix.target }}.zip
      - name: Upload release asset
        shell: bash
        run: gh release upload "$GITHUB_REF_NAME" kcastle-${{ matrix.target }}.${{ matrix.archive }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
