name: CI

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up environment
        uses: ./.github/actions/setup-python-env

      - name: Validate prek configuration
        run: uv run prek validate-config prek.toml

      - name: Lint and type-check
        run: uv run prek run --all-files

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
      fail-fast: false
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up environment
        uses: ./.github/actions/setup-python-env
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest

  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1

      - name: Set up environment
        uses: ./.github/actions/setup-python-env

      - name: Build kcastle-agent
        run: uv build --package kcastle-agent --no-sources --out-dir dist/kcastle-agent

      - name: Build kcastle
        run: uv build --package kcastle --no-sources --out-dir dist/kcastle

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
